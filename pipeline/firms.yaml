# Pinpoint Partners assessment — source inventory for all 15 firms.
# directory_url is the human-facing directory (or practice team view).
# filtered_url is a known entry point, not proof of a full roster.
# results_url is a captured network endpoint. Null means not captured.
# type describes the results endpoint response, not the bio page.
# iterSuffix values are examples from DevTools, not full-roster filters.
# Do not publish a roster until role, practice, all offices, and pagination are verified.
# source_status records the source review on 2026-11-19, including previous
# connector checks where noted. It is documentation, not a refresh setting.
# practice_reference_url and alternate_directory_url are discovery leads only.
# Enable scheduled refreshes only after the connector has completed a verified
# roster and a profile parser is configured.

