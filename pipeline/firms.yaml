# type describes the results endpoint response, not the bio page.
# iterSuffix values are examples from DevTools, not full-roster filters.
#
# Verify partner roles, practice scope, office coverage, and pagination
# before publishing results.
#
# source_status records the source review on 2026-11-19, including previous
# connector checks where noted. It is documentation, not a refresh setting.
# practice_reference_url and alternate_directory_url are discovery leads only.
#
# refresh_enabled enables validated sources with configured profile parsers.
# Complete verified rosters can update listing status and detect removals.
#
# publish_partial_scope permits publication of complete limited-scope results
# without inferring removals or overwriting previously verified roster entries.
#
# expected_partial_scope identifies intentionally limited coverage.
# Unexpected partial coverage returns a nonzero exit code for monitoring
# while preserving previously verified data.
#
# Failed or incomplete extractions are not published.

